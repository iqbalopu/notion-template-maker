template:
  name: "Launch Checklist"
  description: "Comprehensive pre-launch checklist for game releases"

  page:
    title: "{{game_name}} - Launch Checklist"
    icon: "🚀"

  blocks:
    - type: "heading_1"
      text: "🚀 Launch Checklist"

    - type: "paragraph"
      text: "Complete this checklist before launching {{game_name}}"

    - type: "heading_2"
      text: "📱 Store Listings"

    - type: "to_do"
      text: "App Store listing created and reviewed"
      checked: false

    - type: "to_do"
      text: "Google Play listing created and reviewed"
      checked: false

    - type: "to_do"
      text: "Steam store page created and reviewed"
      checked: false

    - type: "to_do"
      text: "Store descriptions written and proofread"
      checked: false

    - type: "to_do"
      text: "Screenshots prepared (minimum 5 per platform)"
      checked: false

    - type: "to_do"
      text: "Trailer/video uploaded"
      checked: false

    - type: "to_do"
      text: "App icon finalized"
      checked: false

    - type: "to_do"
      text: "Age rating submitted"
      checked: false

    - type: "to_do"
      text: "Pricing set correctly"
      checked: false

    - type: "heading_2"
      text: "🎮 Game Build"

    - type: "to_do"
      text: "Final build tested on all target platforms"
      checked: false

    - type: "to_do"
